<article class="post-card">{{ with .Params.cover }}<div class="post-cover"><img src="{{ . | partial "site-url.html" }}" alt="" width="{{ $.Params.coverWidth }}" height="{{ $.Params.coverHeight }}" loading="lazy" decoding="async"></div>{{ else }}<div class="post-card-art" aria-hidden="true"><span class="post-symbol">↔</span><span class="post-art-label">CROW BACKUP / JOURNAL</span></div>{{ end }}<div class="post-card-copy"><p class="article-meta">{{ .Date | time.Format "02.01.2006" }}</p><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p>{{ .Description | truncate 160 }}</p><a class="text-link" href="{{ .RelPermalink }}">{{ i18n "read" }} <span aria-hidden="true">↗</span></a></div></article>
