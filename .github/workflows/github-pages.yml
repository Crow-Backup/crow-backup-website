name: Build and publish Hugo to GitHub Pages

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.167.0'
  TZ: Europe/Zurich

jobs:
  refresh-downloads:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out publishing branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate release updater
        run: node --test scripts/update-downloads.test.mjs

      - name: Refresh download fallback
        run: node scripts/update-downloads.mjs

      - name: Commit changed fallback
        id: commit
        env:
          PUBLISH_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! git diff --quiet -- data/downloads.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- data/downloads.json
            git commit -m "Refresh download fallback from release service"
            git push origin "HEAD:${PUBLISH_BRANCH}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: refresh-downloads
    if: ${{ !cancelled() && (needs.refresh-downloads.result == 'success' || needs.refresh-downloads.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.refresh-downloads.outputs.commit || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Validate release updater
        run: node --test scripts/update-downloads.test.mjs

      - name: Install pinned Hugo
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --retry 3 "${release}/${archive}" --output "${RUNNER_TEMP}/${archive}"
          curl --fail --location --retry 3 "${release}/hugo_${HUGO_VERSION}_checksums.txt" --output "${RUNNER_TEMP}/checksums.txt"
          cd "${RUNNER_TEMP}"
          grep " ${archive}$" checksums.txt | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/hugo" hugo
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: Build and verify migrated content
        run: |
          hugo --gc --minify --destination validation-public --printPathWarnings --printI18nWarnings
          node scripts/llms.mjs validation-public
          node scripts/check.mjs validation-public
          node scripts/portable-urls.mjs validation-public
          node scripts/llms.mjs validation-public
          node scripts/check.mjs validation-public

      - name: Verify GitHub project paths
        run: |
          hugo --gc --minify --baseURL "https://crow-backup.github.io/crow-backup-website/" --destination subpath-public
          node scripts/llms.mjs subpath-public
          node scripts/check.mjs subpath-public
          node scripts/portable-urls.mjs subpath-public
          node scripts/llms.mjs subpath-public
          node scripts/check.mjs subpath-public

      - name: Set up Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6

      - name: Build publishing artifact
        if: github.event_name != 'pull_request'
        env:
          HUGO_RELATIVEURLS: 'false'
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          PUBLISH_BASE_URL="https://${PAGES_BASE_URL#*://}"
          hugo --gc --minify --baseURL "${PUBLISH_BASE_URL%/}/"
          node scripts/portable-urls.mjs public
          node scripts/llms.mjs public
          node scripts/check.mjs public

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
