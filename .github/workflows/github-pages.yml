name: Build and publish Hugo to GitHub Pages

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.167.0'
  TZ: Europe/Zurich

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Install pinned Hugo
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --retry 3 "${release}/${archive}" --output "${RUNNER_TEMP}/${archive}"
          curl --fail --location --retry 3 "${release}/hugo_${HUGO_VERSION}_checksums.txt" --output "${RUNNER_TEMP}/checksums.txt"
          cd "${RUNNER_TEMP}"
          grep " ${archive}$" checksums.txt | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/hugo" hugo
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: Build and verify migrated content
        run: |
          hugo --gc --minify --destination validation-public --printPathWarnings --printI18nWarnings
          node scripts/check.mjs validation-public

      - name: Set up Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6

      - name: Build publishing artifact
        if: github.event_name != 'pull_request'
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
