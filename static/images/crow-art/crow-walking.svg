<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="title desc"><title id="title">Gehende Krähe</title><desc id="desc">Unsere Krähe läuft in einem wiederholten Gehzyklus auf der Stelle. Die Beine wechseln sich ab: Ein Fuss steht, während der andere nach vorne schwingt. Der Körper hebt sich leicht. Bei reduzierter Bewegung bleibt die Krähe stehen.</desc><style>
.walk-motion{animation-duration:1.2s;animation-timing-function:linear;animation-iteration-count:infinite}
.walk-leg{animation-name:crow-stride;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.walk-far{animation-delay:-.6s;stroke:#65705F}.walk-near{stroke:#231F20}
.walk-body{animation-name:crow-bob;transform-origin:30px 45px}
@keyframes crow-stride{0%,100%{d:path('M24 50 22 55 29 63m-4 1 4-1 6 1m-6-1-1 3')}25%{d:path('M24 50 21 56 23 63m-4 1 4-1 6 1m-6-1-1 3')}50%{d:path('M24 50 18 56 17 63m-4 1 4-1 6 1m-6-1-1 3')}75%{d:path('M24 50 22 54 24 58m-4 1 4-1 6 1m-6-1-1 3')}}
@keyframes crow-bob{0%,50%,100%{transform:translateY(0)}25%,75%{transform:translateY(-.8px)}}
@media(prefers-reduced-motion:reduce){.walk-motion{animation:none!important}}
</style><g transform="translate(80 20) scale(2.5)"><g transform="translate(9 0)"><path class="walk-motion walk-leg walk-far" d="M24 50 18 56 17 63m-4 1 4-1 6 1m-6-1-1 3"/></g><path class="walk-motion walk-leg walk-near" d="M24 50 22 55 29 63m-4 1 4-1 6 1m-6-1-1 3"/><g class="walk-motion walk-body"><path xmlns="http://www.w3.org/2000/svg" d="M23 39 4 48 6 53 9 52 11 55 28 49Z" fill="#231F20" /><path xmlns="http://www.w3.org/2000/svg" d="M23 28Q14 33 14 42Q14 53 28 53Q42 53 43 41L39 29Z" fill="#231F20" /><g xmlns="http://www.w3.org/2000/svg" class="crow-head"><g transform="rotate(12 32 22)"><g transform="matrix(.095 0 0 -.095 13 39)"><defs><mask id="walking-head-mask" maskUnits="userSpaceOnUse" x="70" y="65" width="310" height="255"><path d="M87.4 163.4c17-58.2 79-91.3 138.7-73.9s94.2 78.6 77.3 136.8-79 91.2-138.7 73.8-94.2-78.6-77.3-136.8" fill="white" /><path d="M337 185.3 303 232l-29.4-46.8 32.5 2.4zm-90.5-96.7-24.5 15 4.2-18.5m40.6 14-27 14 7.1-19.3m37.2 30.6-30.1.1 13.5-12.2m21.9 37.5-22.6-10.2 14-8.5m15.6 44.5L277 159.7l14.8-4M197 80l-19.8 15.7-.7-15.4m48.7-.7-24.2 19 3.8-16.6" fill="black" /><path d="M287.2 270.2a118 118 0 0 1-91 42.6A117 117 0 0 1 78 196.3C78 131 131 78 196.3 78s109.2 53.4 109.2 118.7c0 1 9 1.5 9 2.4" fill="none" stroke="black" stroke-width="16" /></mask></defs><path d="M87.4 163.4c17-58.2 79-91.3 138.7-73.9s94.2 78.6 77.3 136.8-79 91.2-138.7 73.8-94.2-78.6-77.3-136.8" fill="#231F20" mask="url(#walking-head-mask)" /><path d="M208.6 254s128.4 53 157.3 23.7c1.8-1.8 5-4-1.4-7-27.5-12.9-82.8-50-102-79.3-7-10.6-54 62.7-54 62.7" fill="#231F20" /><path d="M208.7 203c1.2-6.4-3.4-12.7-10.4-14.1s-13.7 2.7-15 9.1c-1.2 6.5 3.4 12.8 10.4 14.2s13.7-2.7 15-9.1" fill="#FEFEFE" /></g></g></g><path xmlns="http://www.w3.org/2000/svg" d="M26 32Q39 33 33 43L13 49 18 44 16 44 21 39 19 39Z" fill="#46534D" class="crow-wing" /></g></g></svg>
